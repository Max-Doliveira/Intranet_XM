<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .card_container {

            background: #f7f6ea;
            color: #1a552b;
            padding: 20px 20px;
            text-shadow: 1px 1px 1px gray;
        }

        .links_setores {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            text-shadow: none;
        }

        .setores {

            flex-direction: row;
            align-items: center;
            width: 50%;
            margin-bottom: 20px;
        }

        .links_setores_link {
            width: 32px;
            height: 64px;
            margin-left: 20px;
            margin-right: 5px;

            background-image: url(https://i.postimg.cc/d3s1Vdb9/folder-svgrepo-com.png);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>

<body>
    <section class="card_container">
        <h1>Arquivos Institucionais</h1>
        <p>Acesse nossos materiais de marca!</p>

        <div class="links_setores">
            <div class="setores">
                <span class="links_setores_link"></span>
                <h2>Timbrados</h2>
            </div>
            <div class="setores">
                <span class="links_setores_link"></span>
                <h2>Papeis de Parede</h2>
            </div>
            <div class="setores">
                <span class="links_setores_link"></span>
                <h2>Fundo de Meet</h2>
            </div>
            <div class="setores">
                <span class="links_setores_link"></span>
                <h2>Regras de Circulação</h2>
            </div>
            <div class="setores">
                <span class="links_setores_link"></span>
                <h2>Fundos de Meet</h2>
            </div>
        </div>


    </section>
</body>

</html>
